name: Repository privacy checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check_customer_data.py
      - run: python3 scripts/check_customer_data.py --history
      - run: python3 tests/privacy-guard.py
